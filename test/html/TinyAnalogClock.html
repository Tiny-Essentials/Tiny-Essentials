<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tiny Analog Clock</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #222;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="clock-wrapper"></div>

    <script type="module">
      import { TinyAnalogClock } from './src/v1/libs/TinyAnalogClock.mjs';

      // 1. Initialize the clock
      const myClock = new TinyAnalogClock({ borderColor: '#ff0055' });
      window.myClock = myClock;

      // 2. Append the generated HTML to your page
      document.getElementById('clock-wrapper').appendChild(myClock.element);
    </script>
  </body>
</html>
