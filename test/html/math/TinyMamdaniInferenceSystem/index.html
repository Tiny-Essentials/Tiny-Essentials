<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Fuzzy Logic Engine - Extreme Climate Suite</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="panel">
      <h2>🎛️ Extreme Climate Control</h2>
      <p class="log-info">Testing full thermal spectrum from -20°C to 100°C.</p>

      <div class="control-group">
        <label for="tempSlider">Current Temperature: <span id="tempValue">27.5</span>°C</label>
        <input type="range" id="tempSlider" min="-20" max="100" step="0.5" value="27.5" />
      </div>

      <div class="control-group">
        <h3>1. Fuzzification (Input Sets)</h3>
        <div id="fuzzifiedOutput" class="data-display">Awaiting input...</div>
      </div>

      <div class="control-group">
        <h3>2. Defuzzification (Output Fan Power)</h3>
        <div
          id="defuzzifiedOutput"
          class="data-display"
          style="font-size: 1.5em; color: var(--accent)"
        >
          0.00%
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>🧪 Automated API Test Suite</h2>
      <p class="log-info">Tests all internal methods, getters, setters, and error handling.</p>
      <button id="runTestsBtn">Run All Tests</button>
      <br /><br />
      <div id="testConsole" class="console-output"></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
