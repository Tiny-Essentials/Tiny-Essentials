<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketcap Tools 💰</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>📊 Marketcap Tools</h1>
    <div class="toolbox">
      <label for="originalMarketCap">Original Market Cap (USD)</label>
      <input type="number" id="originalMarketCap" step="any" />

      <label for="circulatingSupply">Circulating Supply</label>
      <input type="number" id="circulatingSupply" step="any" />

      <label for="newMarketCap">New Market Cap (optional)</label>
      <input type="number" id="newMarketCap" step="any" />

      <button onclick="calculate()">Calculate</button>

      <div class="result" id="resultBox"></div>
    </div>

    <div class="footer">Made with ❤️ by tiny AI for JasminDreasond</div>

    <script type="module" src="app.js"></script>
  </body>
</html>
