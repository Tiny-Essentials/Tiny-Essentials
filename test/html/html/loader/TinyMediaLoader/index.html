<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TinyMediaLoader · Test Harness</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "events": "https://esm.sh/events@3.3.0"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__pulse" aria-hidden="true"></span>
        <h1>TinyMediaLoader <span>Test Harness</span></h1>
      </div>
      <div class="topbar__actions">
        <label class="switch" title="Log every forwarded DOM event (noisy)">
          <input type="checkbox" id="cfg-verbose" />
          <span>Verbose DOM events</span>
        </label>
        <button type="button" class="btn btn--ghost" id="btn-clear-console">Clear console</button>
        <button type="button" class="btn btn--danger" id="btn-destroy-all">Destroy all</button>
      </div>
    </header>

    <main class="layout">
      <div class="column">
        <!-- ══════════════════ SPAWN ══════════════════ -->
        <section class="panel">
          <header class="panel__head">
            <h2>Spawn</h2>
            <span class="badge badge--muted">one card per instance</span>
          </header>
          <div class="panel__body">
            <div class="field">
              <label for="cfg-src">src</label>
              <div class="field__inline">
                <input type="text" id="cfg-src" placeholder="/temp/test.mp4" spellcheck="false" />
                <select id="cfg-preset" class="grow-0" title="Fill the src field only">
                  <option value="">Presets…</option>
                  <optgroup label="Image">
                    <option value="/6d01c26e-e523-4439-8bfc-f656a83cdab0.png">
                      image · 6d01c26e….png
                    </option>
                    <option value="/banner/tiny-essentials.jpg">image · tiny-essentials.jpg</option>
                  </optgroup>
                  <optgroup label="Video">
                    <option value="/temp/test.mp4">video · test.mp4</option>
                  </optgroup>
                  <optgroup label="Audio">
                    <option value="/temp/test.mp3">audio · test.mp3</option>
                  </optgroup>
                  <optgroup label="External (throttle bypassed)">
                    <option value="https://picsum.photos/seed/tiny/800/450">picsum 800×450</option>
                    <option value="https://mdn.github.io/shared-assets/videos/flower.mp4">
                      flower.mp4
                    </option>
                    <option value="https://mdn.github.io/shared-assets/audio/t-rex-roar.mp3">
                      t-rex-roar.mp3
                    </option>
                  </optgroup>
                </select>
              </div>
            </div>

            <div class="grid grid--4">
              <div class="field">
                <label for="cfg-kind">kind</label>
                <select id="cfg-kind">
                  <option value="auto" selected>auto</option>
                  <option value="image">image</option>
                  <option value="video">video</option>
                  <option value="audio">audio</option>
                </select>
              </div>
              <div class="field">
                <label for="cfg-timeout">timeout (ms)</label>
                <input type="number" id="cfg-timeout" value="30000" min="0" step="500" />
              </div>
              <div class="field">
                <label for="cfg-crossorigin">crossOrigin</label>
                <select id="cfg-crossorigin">
                  <option value="">(null)</option>
                  <option value="anonymous">anonymous</option>
                  <option value="use-credentials">use-credentials</option>
                </select>
              </div>
              <div class="field">
                <label for="cfg-preload">preload</label>
                <select id="cfg-preload">
                  <option value="none">none</option>
                  <option value="metadata" selected>metadata</option>
                  <option value="auto">auto</option>
                </select>
              </div>
            </div>

            <div class="toggles">
              <label class="switch"
                ><input type="checkbox" id="cfg-stream" checked /><span>stream</span></label
              >
              <label class="switch"
                ><input type="checkbox" id="cfg-autoreload" /><span>autoReload</span></label
              >
              <label class="switch"
                ><input type="checkbox" id="cfg-autoplay" /><span>autoplay</span></label
              >
              <label class="switch"><input type="checkbox" id="cfg-loop" /><span>loop</span></label>
              <label class="switch"
                ><input type="checkbox" id="cfg-muted" /><span>muted</span></label
              >
              <label class="switch"
                ><input type="checkbox" id="cfg-automount" checked /><span>auto-mount</span></label
              >
              <label class="switch"
                ><input type="checkbox" id="cfg-cache" checked /><span>use cache</span></label
              >
            </div>

            <fieldset class="fieldset">
              <legend>Throttle · /__slow</legend>
              <div class="grid grid--4">
                <label class="switch"
                  ><input type="checkbox" id="cfg-slow" checked /><span>enabled</span></label
                >
                <div class="field">
                  <label for="cfg-slow-chunk">chunk (bytes)</label>
                  <input type="number" id="cfg-slow-chunk" value="65536" min="1" />
                </div>
                <div class="field">
                  <label for="cfg-slow-delay">delay (ms)</label>
                  <input type="number" id="cfg-slow-delay" value="150" min="0" />
                </div>
                <div class="field">
                  <label>resolved</label>
                  <span class="hint" id="slow-preview">—</span>
                </div>
              </div>
            </fieldset>

            <div class="btn-row">
              <button type="button" class="btn btn--primary" id="btn-spawn">Spawn</button>
              <button type="button" class="btn" id="btn-spawn-pair">Spawn ×2 (cold + warm)</button>
              <button type="button" class="btn" id="btn-load-all">load() all</button>
              <button type="button" class="btn btn--danger" id="btn-abort-all">abort() all</button>
            </div>
          </div>
        </section>

        <!-- ══════════════════ LAB ══════════════════ -->
        <section class="panel">
          <header class="panel__head">
            <h2>Lab</h2>
            <span class="badge badge--muted" id="lab-count">0 instances</span>
          </header>
          <div class="panel__body">
            <p class="hint" id="lab-diff"></p>
            <div class="lab" id="lab"></div>
          </div>
        </section>

        <!-- ══════════════════ CACHE INSPECTOR ══════════════════ -->
        <section class="panel">
          <header class="panel__head">
            <h2>Cache inspector</h2>
            <span class="badge badge--muted" id="cache-summary">—</span>
          </header>
          <div class="panel__body">
            <div class="btn-row">
              <button type="button" class="btn" id="btn-cache-refresh">Refresh</button>
              <label class="switch"
                ><input type="checkbox" id="cache-live" checked /><span>live (500 ms)</span></label
              >
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>key</th>
                    <th>size</th>
                    <th>refs</th>
                    <th>objectUrl</th>
                  </tr>
                </thead>
                <tbody id="cache-rows"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ══════════════════ PROGRESS ══════════════════ -->
        <section class="panel">
          <header class="panel__head">
            <h2>TinyMediaProgress</h2>
            <span class="badge badge--muted">value object</span>
          </header>
          <div class="panel__body">
            <div class="grid grid--3">
              <div class="field">
                <label for="progress-total">total (bytes)</label>
                <input type="number" id="progress-total" value="1048576" min="0" />
              </div>
              <div class="field">
                <label for="progress-bytes">push(bytes)</label>
                <input type="number" id="progress-bytes" value="65536" min="0" />
              </div>
              <div class="field">
                <label>&nbsp;</label>
                <button type="button" class="btn btn--primary" id="btn-progress-construct">
                  new TinyMediaProgress()
                </button>
              </div>
            </div>

            <div class="btn-row">
              <button type="button" class="btn" data-progress="start">start()</button>
              <button type="button" class="btn" data-progress="push">push()</button>
              <button type="button" class="btn" data-progress="snapshot">snapshot()</button>
              <button type="button" class="btn" data-progress="reset">reset()</button>
            </div>

            <pre class="readout" id="progress-readout">// no progress instance</pre>
          </div>
        </section>
      </div>

      <!-- ══════════════════ CONSOLE ══════════════════ -->
      <aside class="console">
        <header class="console__head">
          <h2>Output</h2>
          <span class="badge badge--muted" id="console-count">0</span>
        </header>
        <div class="console__body" id="console-output"></div>
      </aside>
    </main>

    <script type="module" src="ui-test.js"></script>
  </body>
</html>
