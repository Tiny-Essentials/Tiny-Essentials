<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinySiteMap Generator | Test Suite</title>

    <!-- CodeMirror CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css"
    />
    <!-- Dracula Theme (VS Code Style) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css"
    />

    <style>
      /* 
           COLOR VARIABLES 
           Used for the professional dark theme.
        */
      :root {
        --bg-dark: #1e1e1e; /* Main background */
        --bg-side: #252526; /* Sidebar background */
        --bg-input: #3c3c3c; /* Input fields */
        --text-main: #cccccc; /* Primary text color */
        --text-bright: #ffffff; /* High emphasis text */
        --accent: #007acc; /* Primary action color (Blue) */
        --error: #f44336; /* Error color (Red) */
        --success: #4caf50; /* Success color (Green) */
        --warning: #ff9800; /* Warning color (Orange) */
        --xml-tag: #569cd6; /* XML Tag color */
        --xml-attr: #9cdcfe; /* XML Attribute color */
        --xml-val: #ce9178; /* XML Value color */
        --xml-comment: #6a9955; /* XML Comment color */
        --border: #454545; /* Borders */
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* HEADER */
      header {
        background-color: var(--bg-side);
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        margin: 0;
        font-size: 1.2rem;
        color: var(--text-bright);
        letter-spacing: 1px;
      }

      /* MAIN LAYOUT */
      main {
        display: grid;
        grid-template-columns: 350px 1fr 1fr;
        flex-grow: 1;
        overflow: hidden;
      }

      section {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 15px;
      }

      h2 {
        font-size: 0.9rem;
        text-transform: uppercase;
        color: var(--text-main);
        margin-top: 0;
        border-bottom: 1px solid var(--border);
        padding-bottom: 5px;
        margin-bottom: 15px;
      }

      /* FORM ELEMENTS */
      .field-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-size: 0.8rem;
        margin-bottom: 5px;
        color: #aaa;
      }

      input,
      select,
      textarea {
        width: 100%;
        background-color: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text-bright);
        padding: 8px;
        border-radius: 3px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 0.85rem;
      }

      input:focus {
        outline: 1px solid var(--accent);
      }

      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      button {
        cursor: pointer;
        padding: 8px 12px;
        border: none;
        border-radius: 3px;
        font-weight: bold;
        font-size: 0.8rem;
        transition: opacity 0.2s;
      }

      button:hover {
        opacity: 0.8;
      }
      .btn-primary {
        background-color: var(--accent);
        color: white;
      }
      .btn-secondary {
        background-color: #555;
        color: white;
      }
      .btn-success {
        background-color: var(--success);
        color: white;
      }
      .btn-danger {
        background-color: var(--error);
        color: white;
      }

      /* XML VIEWER */
      #xml-output {
        background-color: #1e1e1e;
        padding: 15px;
        margin: 0;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 0.9rem;
        white-space: pre-wrap;
        word-break: break-all;
        flex-grow: 1;
        overflow: auto;
      }

      /* Syntax Highlighting Classes */
      .xml-tag {
        color: var(--xml-tag);
      }
      .xml-attr {
        color: var(--xml-attr);
      }
      .xml-val {
        color: var(--xml-val);
      }
      .xml-text {
        color: var(--text-bright);
      }

      /* CONSOLE */
      #console {
        height: 150px;
        background-color: #000;
        border-top: 3px solid var(--border);
        padding: 10px;
        font-family: 'Consolas', monospace;
        font-size: 0.85rem;
        overflow-y: auto;
      }

      .log-entry {
        margin-bottom: 4px;
        border-left: 3px solid #444;
        padding-left: 8px;
      }
      .log-error {
        color: var(--error);
        border-left-color: var(--error);
      }
      .log-success {
        color: var(--success);
        border-left-color: var(--success);
      }
      .log-info {
        color: var(--accent);
        border-left-color: var(--accent);
      }

      .editor-wrapper,
      #data-json,
      #xml-editor-container,
      .CodeMirror {
        height: 100% !important;
      }

      /* CodeMirror Overrides */
      .CodeMirror {
        font-size: 13px !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>TinySiteMap <small style="font-size: 0.6rem; opacity: 0.5">PRO TEST SUITE</small></h1>
      <div id="status-indicator" style="font-size: 0.8rem; color: var(--text-dim)">
        System Ready
      </div>
    </header>

    <main>
      <!-- CONFIGURATION PANEL -->
      <section id="config-panel">
        <h2>Configuration</h2>
        <div class="field-group">
          <label>Base URL</label>
          <input type="text" id="cfg-base-url" value="https://www.example.com" />
        </div>
        <div class="field-group">
          <label>Sitemap Type</label>
          <select id="cfg-type">
            <option value="normal">Normal (urlset)</option>
            <option value="index">Index (sitemapindex)</option>
          </select>
        </div>
        <div class="field-group">
          <label>Max URL Size</label>
          <input type="number" id="cfg-max-size" value="2048" />
        </div>

        <h2 style="margin-top: 20px">Templates</h2>
        <div class="btn-group">
          <button class="btn-secondary" onclick="loadTemplate('normal')">Load Normal</button>
          <button class="btn-secondary" onclick="loadTemplate('index')">Load Index</button>
        </div>

        <h2 style="margin-top: 20px">Input Data (JSON)</h2>
        <div class="editor-wrapper" style="height: 300px">
          <label>Editor (JSON Format)</label>
          <textarea id="data-json"></textarea>
        </div>

        <div class="btn-group" style="margin-top: 15px">
          <button
            class="btn-primary"
            style="grid-column: span 2; padding: 12px"
            onclick="runGenerate()"
          >
            Generate XML
          </button>
        </div>
      </section>

      <!-- OPERATIONS PANEL -->
      <section id="editor-panel">
        <h2>Object Operations</h2>
        <p style="font-size: 0.7rem; color: var(--text-dim); margin-top: 0">
          Manipulate the current instance state.
        </p>

        <div class="btn-group">
          <button class="btn-success" onclick="runAdd()">Add Entry</button>
          <button class="btn-secondary" onclick="runUpdate()">Update[0]</button>
        </div>
        <div class="btn-group">
          <button class="btn-secondary" onclick="runMove()">Move[0 $\rightarrow$ 1]</button>
          <button class="btn-danger" onclick="runRemove()">Remove[0]</button>
        </div>

        <h2 style="margin-top: 20px">Instance State</h2>
        <div
          id="instance-state"
          style="
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: monospace;
            background: var(--bg-side);
            padding: 10px;
            border-radius: 4px;
          "
        >
          No instance active.
        </div>
      </section>

      <!-- XML VIEWER (CODE EDITOR) -->
      <section id="viewer-panel" style="border-right: none; padding: 0">
        <div class="editor-wrapper">
          <label>XML Output (Read-Only Editor)</label>
          <div id="xml-editor-container"></div>
        </div>
      </section>
    </main>

    <div id="console">
      <div class="log-entry log-info">System: Test environment initialized. Ready for testing.</div>
    </div>

    <!-- CodeMirror Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

    <script type="module">
      // --- PASTE YOUR CLASS HERE OR IMPORT IT ---
      // For this single-file demonstration, I am including the class directly.
      // In a real environment, you would use: import TinySiteMap from './TinySiteMap.js';
      import { TinySiteMap } from '/src/v1/libs/tools/TinySiteMap.mjs';

      // --- TEST SUITE LOGIC ---

      let generator = null;
      let xmlEditor = null;

      const log = (msg, type = 'info') => {
        const consoleEl = document.getElementById('console');
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
      };

      const updateStateDisplay = () => {
        const stateEl = document.getElementById('instance-state');
        if (generator) {
          stateEl.textContent = `Type: ${generator.type}\nEntries: ${generator.entries.length}\nBase: ${generator.baseUrl}`;
        } else {
          stateEl.textContent = 'No instance active.';
        }
      };

      // Initialize CodeMirror Editor for XML
      window.addEventListener('DOMContentLoaded', () => {
        xmlEditor = CodeMirror(document.getElementById('xml-editor-container'), {
          mode: 'xml',
          theme: 'dracula',
          readOnly: true,
          lineNumbers: true,
          minimap: false,
        });
      });

      window.loadTemplate = (type) => {
        const jsonArea = document.getElementById('data-json');
        const typeSelect = document.getElementById('cfg-type');
        typeSelect.value = type;

        if (type === 'normal') {
          jsonArea.value = JSON.stringify(
            [
              { loc: '/home', lastmod: '2023-10-27T10:00:00Z', priority: 1.0 },
              { loc: '/about', changefreq: 'monthly' },
              { loc: '/contact', customTags: { 'example:contactType': 'support' } },
            ],
            null,
            2,
          );
        } else {
          jsonArea.value = JSON.stringify(
            [{ loc: '/sitemap-pages.xml' }, { loc: '/sitemap-posts.xml' }],
            null,
            2,
          );
        }
        log(`Template '${type}' loaded into editor.`, 'info');
      };

      window.runGenerate = () => {
        try {
          const config = {
            baseUrl: document.getElementById('cfg-base-url').value,
            type: document.getElementById('cfg-type').value,
            maxResolvedUrlSize: parseInt(document.getElementById('cfg-max-size').value),
            entries: JSON.parse(document.getElementById('data-json').value),
          };

          generator = new TinySiteMap(config);
          const xml = generator.generateXml();

          // Update the CodeMirror editor
          xmlEditor.setValue(xml);

          log('XML generated successfully.', 'success');
          updateStateDisplay();
        } catch (e) {
          log(`${e.name}: ${e.message}`, 'error');
          xmlEditor.setValue('ERROR: ' + e.message);
        }
      };

      window.runAdd = () => {
        if (!generator) return log('Generate XML first to create instance.', 'error');
        try {
          const data = JSON.parse(document.getElementById('data-json').value);
          // Add a dummy entry based on the last item's structure
          const template = data[0] || { loc: '/new' };
          generator.addEntry({ ...template, loc: (template.loc + '/new').replace('//', '/') });
          log('Entry added successfully.', 'success');
          runGenerate(); // Refresh view
          updateStateDisplay();
        } catch (e) {
          log(`${e.name}: ${e.message}`, 'error');
        }
      };

      window.runUpdate = () => {
        if (!generator) return log('Generate XML first to create instance.', 'error');
        try {
          const data = JSON.parse(document.getElementById('data-json').value);
          generator.updateEntry(0, data[0]);
          log('Entry 0 updated.', 'success');
          runGenerate();
          updateStateDisplay();
        } catch (e) {
          log(`${e.name}: ${e.message}`, 'error');
        }
      };

      window.runRemove = () => {
        if (!generator) return log('Generate XML first to create instance.', 'error');
        try {
          generator.removeEntry(0);
          log('Entry 0 removed.', 'success');
          runGenerate();
          updateStateDisplay();
        } catch (e) {
          log(`${e.name}: ${e.message}`, 'error');
        }
      };

      window.runMove = () => {
        if (!generator) return log('Generate XML first to create instance.', 'error');
        try {
          generator.moveEntry(0, 1);
          log('Moved entry 0 to index 1.', 'success');
          runGenerate();
          updateStateDisplay();
        } catch (e) {
          log(`${e.name}: ${e.message}`, 'error');
        }
      };

      // Init
      window.loadTemplate('normal');
    </script>
  </body>
</html>
