<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyTextDiffer - Test Lab</title>
    <style>
      :root {
        --bg-color: #1e1e1e;
        --sidebar-bg: #252526;
        --text-color: #d4d4d4;
        --accent-color: #3f51b5;
        --added-bg: #2ea04333;
        --added-text: #3fb950;
        --deleted-bg: #f8514933;
        --deleted-text: #f85149;
        --border-color: #30363d;
        --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-main);
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar - History Management */
      aside {
        width: 350px;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      h2 {
        font-size: 1.2rem;
        margin-top: 0;
        color: #fff;
      }

      .history-list {
        flex-grow: 1;
        overflow-y: auto;
        margin-bottom: 20px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      .history-item {
        padding: 10px;
        border-bottom: 1px solid var(--border-color);
        cursor: pointer;
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .history-item:hover {
        background-color: #2d2d30;
      }
      .history-item.selected {
        border-left: 4px solid var(--accent-color);
        background-color: #37373d;
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      textarea {
        background: #121212;
        color: #fff;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 10px;
        resize: none;
        font-family: monospace;
      }

      button {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 4px;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }
      button.danger {
        background-color: #a12626;
      }

      /* Main Area - Comparison */
      main {
        flex-grow: 1;
        padding: 40px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .diff-container {
        background-color: #0d1117;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 20px;
        line-height: 1.6;
        font-family: 'Cascadia Code', 'Fira Code', monospace;
        white-space: pre-wrap;
        min-height: 200px;
      }

      .diff-normal {
        color: var(--text-color);
      }
      .diff-added {
        background-color: var(--added-bg);
        color: var(--added-text);
        text-decoration: none;
      }
      .diff-deleted {
        background-color: var(--deleted-bg);
        color: var(--deleted-text);
        text-decoration: line-through;
      }

      .log-panel {
        margin-top: auto;
        background: #000;
        padding: 10px;
        font-size: 0.8rem;
        color: #888;
        border-radius: 4px;
        max-height: 100px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <aside>
      <h2>Version History</h2>
      <div id="historyList" class="history-list"></div>

      <div class="controls">
        <textarea id="textInput" rows="4" placeholder="Type text here..."></textarea>
        <button id="addBtn">Add to History</button>
        <div style="display: flex; gap: 5px">
          <button id="compareBtn" style="flex: 1">Compare Selected (2)</button>
          <button id="clearBtn" class="danger">Clear</button>
        </div>
      </div>
    </aside>

    <main>
      <h2>Diff Preview</h2>
      <div id="diffOutput" class="diff-container">
        Select two versions from the sidebar to compare...
      </div>

      <div class="log-panel" id="logPanel">System initialized. Ready for input.</div>
    </main>

    <script type="module">
      import { TinyTextDiffer } from './src/v1/libs/TinyTextDiffer.mjs';

      /** @type {TinyTextDiffer} */
      const differ = new TinyTextDiffer(['Hello World', 'Hellow World!']);
      window.differ = differ;

      /** @type {number[]} */
      let selectedIndexes = [];

      const historyList = document.getElementById('historyList');
      const textInput = document.getElementById('textInput');
      const diffOutput = document.getElementById('diffOutput');
      const logPanel = document.getElementById('logPanel');

      /**
       * @param {string} msg
       * @param {boolean} isError
       * @returns {void}
       */
      const log = (msg, isError = false) => {
        const entry = document.createElement('div');
        entry.style.color = isError ? '#ff6b6b' : '#888';
        entry.textContent = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        logPanel.prepend(entry);
      };

      /**
       * @returns {void}
       */
      const renderHistory = () => {
        historyList.innerHTML = '';
        differ.history.forEach((text, index) => {
          const div = document.createElement('div');
          div.className = `history-item ${selectedIndexes.includes(index) ? 'selected' : ''}`;
          div.innerHTML = `<span><strong>v${index}</strong>: ${text.substring(0, 20)}${text.length > 20 ? '...' : ''}</span>`;

          div.onclick = () => {
            toggleSelection(index);
          };

          const delBtn = document.createElement('button');
          delBtn.textContent = '×';
          delBtn.className = 'danger';
          delBtn.style.padding = '2px 8px';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            differ.removeAt(index);
            selectedIndexes = selectedIndexes.filter((i) => i !== index);
            renderHistory();
            log(`Removed index ${index}`);
          };

          div.appendChild(delBtn);
          historyList.appendChild(div);
        });
      };

      /**
       * @param {number} index
       * @returns {void}
       */
      const toggleSelection = (index) => {
        if (selectedIndexes.includes(index)) {
          selectedIndexes = selectedIndexes.filter((i) => i !== index);
        } else {
          if (selectedIndexes.length >= 2) selectedIndexes.shift();
          selectedIndexes.push(index);
        }
        renderHistory();
      };

      document.getElementById('addBtn').onclick = () => {
        try {
          const val = textInput.value;
          if (!val) return;
          differ.add(val);
          textInput.value = '';
          renderHistory();
          log('New version added.');
        } catch (e) {
          log(e.message, true);
        }
      };

      document.getElementById('compareBtn').onclick = () => {
        try {
          if (selectedIndexes.length !== 2) {
            throw new Error('Please select exactly two versions to compare.');
          }

          // Sorting to ensure logic flow (old vs new)
          const [idx1, idx2] = [...selectedIndexes].sort((a, b) => a - b);

          /** @type {DiffResult[][]} */
          const results = differ.compare(idx1, idx2);
          renderDiff(results[0]);
          log(`Comparing v${idx1} with v${idx2}`);
        } catch (e) {
          log(e.message, true);
        }
      };

      /**
       * @param {DiffResult[]} diffArray
       * @returns {void}
       */
      const renderDiff = (diffArray) => {
        diffOutput.innerHTML = '';
        diffArray.forEach((part) => {
          const span = document.createElement('span');
          span.className = `diff-${part.type}`;
          span.textContent = part.value;
          diffOutput.appendChild(span);
        });
      };

      document.getElementById('clearBtn').onclick = () => {
        differ.clear();
        selectedIndexes = [];
        diffOutput.textContent = 'History cleared.';
        renderHistory();
        log('History cleared.');
      };

      // Initial Render
      renderHistory();
    </script>
  </body>
</html>
