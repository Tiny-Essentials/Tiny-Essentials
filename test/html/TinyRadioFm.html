<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyRadioFm | Test Environment</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #334155;
        --font-mono: 'Fira Code', 'Cascadia Code', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Layout Structure */
      header {
        padding: 1rem 2rem;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      main {
        display: grid;
        grid-template-columns: 380px 1fr 380px;
        gap: 1px;
        background: var(--border);
        flex: 1;
        overflow: hidden;
      }

      section {
        background: var(--bg-color);
        padding: 1.5rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      /* UI Components */
      .card {
        background: var(--card-bg);
        border-radius: 8px;
        padding: 1rem;
        border: 1px solid var(--border);
      }

      h2 {
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn {
        cursor: pointer;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        border: none;
        font-weight: 600;
        font-size: 0.875rem;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--bg-color);
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-primary);
      }
      .btn-outline:hover {
        background: var(--border);
      }
      .btn-danger {
        background: var(--danger);
        color: white;
      }
      .btn-warning {
        background: var(--warning);
        color: var(--bg-color);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      input[type='text'],
      input[type='number'],
      select,
      textarea {
        background: var(--bg-color);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 0.5rem;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        width: 100%;
      }

      /* PLAYER UI */
      #player-card {
        border: 2px solid var(--accent);
        background: linear-gradient(145deg, #1e293b, #0f172a);
      }

      /* Live Status Display */
      #live-status {
        background: rgba(0, 0, 0, 0.3);
        padding: 1rem;
        border-radius: 6px;
        border-left: 4px solid var(--accent);
      }

      .now-playing-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.5rem;
      }

      .thumbnail {
        width: 64px;
        height: 64px;
        border-radius: 6px;
        object-fit: cover;
        background: var(--bg-color);
        border: 1px solid var(--border);
      }

      .thumbnail.default {
        padding: 10px;
      }

      .status-item {
        font-size: 0.875rem;
        margin-bottom: 0.15rem;
      }
      .status-label {
        color: var(--text-secondary);
      }
      .status-value {
        color: var(--accent);
        font-family: var(--font-mono);
      }

      .progress-container {
        width: 100%;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        margin-top: 0.5rem;
        overflow: hidden;
      }
      #progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
      }

      .player-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .volume-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
        margin-left: 0.5rem;
      }

      input[type='range'] {
        flex: 1;
        cursor: pointer;
      }

      /* LISTS & LOGS */
      .list-container {
        font-size: 0.75rem;
        max-height: 200px;
        overflow-y: auto;
        background: #000;
        padding: 0.5rem;
        border-radius: 4px;
        font-family: var(--font-mono);
      }

      .log-entry {
        padding: 0.25rem 0;
        border-bottom: 1px solid #1e293b;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      .log-time {
        color: var(--text-secondary);
      }
      .log-msg {
        color: var(--text-primary);
        flex: 1;
        word-break: break-all;
      }

      .tag {
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 10px;
        text-transform: uppercase;
        font-weight: bold;
      }
      .tag-music {
        background: #1e40af;
      }
      .tag-voice {
        background: #065f46;
      }
      .tag-custom {
        background: #92400e;
      }
      .tag-task {
        background: #5b21b6;
      }

      /* Progress Bar */
      .progress-container {
        width: 100%;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        margin-top: 0.5rem;
        overflow: hidden;
      }
      #progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.1s linear;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Audio Engine (Hidden) -->
    <audio id="audio-engine"></audio>

    <header>
      <div>
        <h1 style="font-size: 1.25rem">
          TinyRadioFm <span style="color: var(--accent); font-weight: 300">Test Suite</span>
        </h1>
      </div>
      <div id="clock" style="font-family: var(--font-mono); color: var(--text-secondary)">
        00:00:00
      </div>
    </header>

    <main>
      <!-- COLUMN 1: CONTROLS & CONFIG -->
      <section>
        <div class="card">
          <h2 style="color: var(--accent)">
            <span style="color: var(--accent)">+</span> Add Content
          </h2>
          <div class="input-group">
            <label>Audio File</label>
            <input type="file" id="file-input" accept="audio/*" />
          </div>
          <div class="grid-2">
            <div class="input-group" style="margin-bottom: 0">
              <label>Category</label>
              <select id="content-type">
                <option value="music">Music</option>
                <option value="voice">Voice</option>
                <option value="custom">Custom Position</option>
              </select>
            </div>
            <div class="input-group" style="margin-bottom: 0">
              <label>Custom TS (ms)</label>
              <input type="number" id="custom-ts" value="0" />
            </div>
          </div>
          <button class="btn btn-primary" id="btn-add" style="width: 100%; margin-top: 1rem">
            Load & Add
          </button>
        </div>

        <div class="card">
          <h2 style="color: var(--warning)">
            <span style="color: var(--warning)">⚙</span> Configuration
          </h2>

          <div class="input-group">
            <label>Unknown Artist Fallback</label>
            <input type="text" id="cfg-unknown-artist" value="Unknown Artist" />
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label>Seed</label>
              <input type="number" id="cfg-seed" value="12345" />
            </div>
            <div class="input-group">
              <label>Query Limit</label>
              <input type="number" id="cfg-queryLimit" value="100000" />
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label>Music Mode</label>
              <select id="cfg-mode">
                <option value="playlist">Playlist</option>
                <option value="random">Random</option>
              </select>
            </div>
            <div class="input-group">
              <label>Voice Mode</label>
              <select id="cfg-voiceMode">
                <option value="playlist">Playlist</option>
                <option value="random">Random</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label>Music Max Consec.</label>
              <input type="number" id="cfg-musicMaxConsecutive" value="1" />
            </div>
            <div class="input-group">
              <label>Voice Max Consec.</label>
              <input type="number" id="cfg-voiceMaxConsecutive" value="1" />
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label>Voice Min</label>
              <input type="number" id="cfg-voiceMin" value="0" />
            </div>
            <div class="input-group">
              <label>Voice Max</label>
              <input type="number" id="cfg-voiceMax" value="1" />
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label>Silence Gap (ms)</label>
              <input type="number" id="cfg-silence" value="1000" />
            </div>
            <div class="input-group" style="justify-content: flex-end">
              <label style="margin-bottom: 0.5rem"
                ><input type="checkbox" id="cfg-voiceAfterMusic" checked /> Voice After Music</label
              >
            </div>
          </div>

          <button class="btn btn-outline" id="btn-apply-cfg" style="width: 100%">
            Apply Config
          </button>
        </div>
      </section>

      <!-- COLUMN 2: PLAYER & MANAGEMENT -->
      <section>
        <!-- THE PLAYER CARD -->
        <div class="card" id="player-card">
          <h2 style="color: var(--accent)">
            <span style="color: var(--accent)">▶</span> Live Radio Player
          </h2>
          <div id="live-status">
            <div class="now-playing-header">
              <img
                id="st-thumb"
                class="thumbnail default"
                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18V5l12-2v13'></path><circle cx='6' cy='18' r='3'></circle><circle cx='18' cy='16' r='3'></circle></svg>"
              />
              <div>
                <div class="status-item">
                  <span class="status-label">Title:</span>
                  <span class="status-value" id="st-title">Idle</span>
                </div>
                <div class="status-item">
                  <span class="status-label">Artist:</span>
                  <span class="status-value" id="st-artist">-</span>
                </div>
                <div class="status-item">
                  <span class="status-label">Rem:</span>
                  <span class="status-value" id="st-rem">-</span>
                </div>
              </div>
            </div>

            <div class="progress-container"><div id="progress-bar"></div></div>
          </div>

          <div class="player-controls">
            <button class="btn btn-primary" id="btn-start-engine">Start Engine</button>
            <button class="btn btn-warning" id="btn-resync" title="Resync Audio" disabled>
              🔄
            </button>
            <button class="btn btn-outline" id="btn-mute" title="Mute/Unmute Audio" disabled>
              ⏸️
            </button>

            <div class="volume-control">
              <label>Vol</label>
              <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" />
            </div>
          </div>
        </div>

        <div class="card">
          <h2 style="color: var(--danger)">
            <span style="color: var(--danger)">📅</span> Tasks & Direct Management
          </h2>

          <div class="grid-2">
            <div class="input-group">
              <label>Target Timeline</label>
              <select id="task-type">
                <option value="music">Music</option>
                <option value="voice">Voice</option>
              </select>
            </div>
            <div class="input-group">
              <label>Action</label>
              <select id="task-action">
                <option value="add">Add (Mock Data)</option>
                <option value="remove">Remove</option>
                <option value="move">Move</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group">
              <label>Target ID (Rem/Move)</label>
              <input type="text" id="task-id" placeholder="ID" />
            </div>
            <div class="input-group">
              <label>New Index (Move)</label>
              <input type="number" id="task-newIndex" value="0" />
            </div>
          </div>

          <div class="grid-2">
            <div class="input-group" style="margin-bottom: 0">
              <label>Delay (ms from now)</label>
              <input type="number" id="task-delay" value="5000" />
            </div>
            <div class="input-group" style="margin-bottom: 0; justify-content: flex-end">
              <button class="btn btn-outline" id="btn-schedule" style="width: 100%">
                Schedule
              </button>
            </div>
          </div>

          <hr style="border: 0; border-top: 1px solid var(--border); margin: 1rem 0" />

          <div class="grid-2">
            <div class="input-group" style="margin-bottom: 0">
              <input type="text" id="manage-id" placeholder="ID to kill instantly" />
            </div>
            <button class="btn btn-danger" id="btn-remove-now">Remove Now</button>
          </div>
        </div>

        <div class="card" style="flex: 1; display: flex; flex-direction: column">
          <h2>📋 Active State Lists</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; flex: 1">
            <div style="display: flex; flex-direction: column">
              <label>Music List</label>
              <div class="list-container" id="list-music" style="flex: 1; max-height: none"></div>
            </div>
            <div style="display: flex; flex-direction: column">
              <label>Voice / Custom / Tasks</label>
              <div class="list-container" id="list-others" style="flex: 1; max-height: none"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- COLUMN 3: SYSTEM & LOGS -->
      <section>
        <div class="card">
          <h2>🔍 Query Engine</h2>
          <div class="grid-2">
            <div class="input-group">
              <label>Offset (ms)</label>
              <input type="number" id="query-offset" value="10000" />
            </div>
            <div class="input-group" style="justify-content: flex-end">
              <button class="btn btn-outline" id="btn-query">Predict Future</button>
            </div>
          </div>
          <button
            class="btn btn-outline"
            id="btn-search-custom"
            style="width: 100%; margin-top: 0.5rem"
          >
            Search Active Custom Pos.
          </button>

          <div class="list-container" id="query-results" style="margin-top: 1rem; min-height: 60px">
            No query results.
          </div>
        </div>

        <div class="card">
          <h2>💾 State Management</h2>
          <div class="grid-2">
            <button class="btn btn-primary" id="btn-export">Export State</button>
            <button class="btn btn-outline" id="btn-import">Import State</button>
            <input type="file" id="import-file" accept=".json" style="display: none" />
          </div>
        </div>

        <div class="card" style="flex: 1; display: flex; flex-direction: column">
          <h2>📜 System Logs</h2>
          <div class="list-container" id="system-logs" style="flex: 1; max-height: none"></div>
        </div>
      </section>
    </main>

    <script type="module">
      /** STUB: TinyEvents */
      class TinyEvents {
        constructor() {
          this.listeners = {};
        }
        on(event, cb) {
          (this.listeners[event] = this.listeners[event] || []).push(cb);
        }
        emit(event, data) {
          (this.listeners[event] || []).forEach((cb) => cb(data));
        }
      }

      /** IMPORT: TinyRadioFm */
      import { TinyRadioFm } from './src/v1/libs/TinyRadioFm.mjs';
      import { parseBlob } from 'https://cdn.jsdelivr.net/npm/music-metadata@11.13.0/+esm';
      window.TinyRadioFm = TinyRadioFm;

      // --- UI Controller ---
      class TestEnvironment {
        constructor() {
          this.radio = new TinyRadioFm();
          this.audio = document.getElementById('audio-engine');
          this.currentPlayingId = null;
          this.isEngineStarted = false;
          this.tickCounter = 0; // Used to spaced updates (e.g. Query Engine)

          this.imgEl = document.getElementById('st-thumb');
          this.setupEventListeners();
          this.bindRadioEvents();
          this.startUpdateLoop();
          this.log('Environment Ready. Click "Start Engine" to enable audio.');
          this.imgEl.addEventListener('error', () => this.resetThumbnail());
        }

        log(msg) {
          const logs = document.getElementById('system-logs');
          const entry = document.createElement('div');
          entry.className = 'log-entry';
          entry.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> <span class="log-msg">${msg}</span>`;
          logs.prepend(entry);
        }

        bindRadioEvents() {
          // Automatically update the entire interface when data changes
          const syncUI = () => {
            this.updateLists();
            this.handleQuery(); // Ensure that the forecast of the future is updated immediately
          };

          this.radio.on('unknownArtistChanged', (d) => {
            this.log(`Event: unknownArtistChanged -> ${d.unknownArtist}`);
            syncUI();
          });
          this.radio.on('seedChanged', (d) => {
            this.log(`Event: seedChanged -> ${d.seed}`);
            syncUI();
          });
          this.radio.on('configChanged', (d) => {
            this.log(`Event: configChanged`);
            console.log('New Config:', d.config);
            syncUI();
          });

          this.radio.on('contentAdded', (d) => {
            this.log(`Event: contentAdded -> [${d.type}] ${d.data.title}`);
            syncUI();
          });
          this.radio.on('taskScheduled', (d) => {
            this.log(`Event: taskScheduled -> ${d.action} on ${d.type}`);
            syncUI();
          });
          this.radio.on('contentRemoved', (d) => {
            this.log(`Event: contentRemoved -> ID ${d.id}`);
            syncUI();
          });
          this.radio.on('taskExecuted', (d) => {
            this.log(`Event: taskExecuted -> ${d.action} completed.`);
            syncUI();
          });
          this.radio.on('customPositionExpired', (d) => {
            this.log(`Event: customPositionExpired -> ID ${d.contentId}`);
            syncUI();
          });

          this.radio.on('stateImported', () => {
            this.log(`Event: stateImported -> Success`);
            syncUI();
          });
        }

        setupEventListeners() {
          // Add Content
          // Actions
          document
            .getElementById('btn-add')
            .addEventListener('click', () => this.handleAddContent());

          // Config
          document
            .getElementById('btn-apply-cfg')
            .addEventListener('click', () => this.handleApplyConfig());

          // Schedule
          document
            .getElementById('btn-schedule')
            .addEventListener('click', () => this.handleScheduleTask());
          document.getElementById('btn-remove-now').addEventListener('click', () => {
            const id = document.getElementById('manage-id').value;
            if (id) {
              this.radio.remove(id);
            }
          });

          // Queries
          document.getElementById('btn-query').addEventListener('click', () => this.handleQuery());
          document.getElementById('btn-search-custom').addEventListener('click', () => {
            const pos = this.radio.searchCustomPositions();
            this.log(`Found ${pos.length} custom positions active. Check DevTools console.`);
            console.table(pos);
          });

          // State
          document
            .getElementById('btn-export')
            .addEventListener('click', () => this.handleExport());
          document
            .getElementById('btn-import')
            .addEventListener('click', () => document.getElementById('import-file').click());
          document
            .getElementById('import-file')
            .addEventListener('change', (e) => this.handleImport(e));

          // Player Setup
          document
            .getElementById('btn-start-engine')
            .addEventListener('click', () => this.startEngine());
          document.getElementById('btn-resync').addEventListener('click', () => this.resyncAudio());

          // Mute / Pause logic
          const btnMute = document.getElementById('btn-mute');
          btnMute.addEventListener('click', () => {
            this.audio.muted = !this.audio.muted;
            if (this.audio.muted) {
              btnMute.innerText = '▶️';
              btnMute.classList.add('btn-danger');
              btnMute.classList.remove('btn-outline');
            } else {
              btnMute.innerText = '⏸️';
              btnMute.classList.remove('btn-danger');
              btnMute.classList.add('btn-outline');
            }
          });

          document.getElementById('volume-slider').addEventListener('input', (e) => {
            this.audio.volume = e.target.value;
          });
        }

        async startEngine() {
          this.isEngineStarted = true;
          // Play a silent buffer or just unlock audio context
          this.audio
            .play()
            .then(() => {
              this.audio.pause();
              const btnStart = document.getElementById('btn-start-engine');
              btnStart.innerText = 'Engine Running';
              btnStart.classList.replace('btn-primary', 'btn-outline');
              btnStart.disabled = true;

              // Hides the manual resync and automatically triggers the first sync
              const btnResync = document.getElementById('btn-resync');
              const btnMute = document.getElementById('btn-mute');
              btnResync.style.display = 'none';
              btnMute.disabled = false;

              this.log('Audio Engine Unlocked.');
              this.resyncAudio();
            })
            .catch((e) => this.log('Error starting engine: ' + e.message));
        }

        async handleAddContent() {
          const file = document.getElementById('file-input').files[0];
          if (!file) return alert('Select an audio file.');
          const type = document.getElementById('content-type').value;
          const customTs = parseInt(document.getElementById('custom-ts').value);

          try {
            this.log(`Processing ${file.name}...`);
            const url = URL.createObjectURL(file);
            const content = await TinyRadioFm.prepareContent(url, {}, parseBlob, {
              onProgress: (p) => console.log(`[${p.stage}] ${p.status}`),
              onError: (e) =>
                console.error(`Failed at ${e.stage} for ${e.url}: ${e.error.message}`),
            });

            if (type === 'custom') content.timestamp = customTs > 0 ? customTs : Date.now();

            this.radio.add(type, content);
          } catch (err) {
            this.log(`Error: ${err.message}`);
          }
        }

        handleApplyConfig() {
          try {
            const seed = parseInt(document.getElementById('cfg-seed').value);
            const unknownArtist = document.getElementById('cfg-unknown-artist').value;

            const cfg = {
              mode: document.getElementById('cfg-mode').value,
              voiceMode: document.getElementById('cfg-voiceMode').value,
              silenceDuration: parseInt(document.getElementById('cfg-silence').value),
              queryLimit: parseInt(document.getElementById('cfg-queryLimit').value),
              voiceAfterMusic: document.getElementById('cfg-voiceAfterMusic').checked,
              voiceMin: parseInt(document.getElementById('cfg-voiceMin').value),
              voiceMax: parseInt(document.getElementById('cfg-voiceMax').value),
              musicMaxConsecutive: parseInt(
                document.getElementById('cfg-musicMaxConsecutive').value,
              ),
              voiceMaxConsecutive: parseInt(
                document.getElementById('cfg-voiceMaxConsecutive').value,
              ),
            };

            this.radio.seed = seed;
            this.radio.unknownArtist = unknownArtist;
            this.radio.setConfig(cfg);
          } catch (e) {
            this.log(`Config Error: ${e.message}`);
          }
        }

        handleScheduleTask() {
          try {
            const delay = parseInt(document.getElementById('task-delay').value);
            const action = document.getElementById('task-action').value;
            const type = document.getElementById('task-type').value;
            const targetId = document.getElementById('task-id').value;
            const newIndex = parseInt(document.getElementById('task-newIndex').value);
            const timestamp = Date.now() + delay;

            let payload;
            if (action === 'add') {
              payload = {
                id: 'mock-' + Math.random().toString(36).substr(2, 5),
                title: 'Mock Scheduled ' + type,
                artist: 'System',
                duration: 5000,
                url: '',
              };
            } else if (action === 'remove') {
              payload = targetId;
            } else if (action === 'move') {
              payload = { id: targetId, newIndex: newIndex };
            }

            this.radio.scheduleTask(timestamp, action, type, payload);
          } catch (e) {
            this.log(`Schedule Error: ${e.message}`);
          }
        }

        handleQuery() {
          try {
            const offset = parseInt(document.getElementById('query-offset').value);
            const results = this.radio.queryTimeline(Date.now() + offset, 30);
            const container = document.getElementById('query-results');
            container.innerHTML = results.length ? '' : 'No upcoming events generated.';
            results.forEach((ev) => {
              container.innerHTML += `<div class="log-entry"><span>${ev.title}</span> <span style="color:var(--text-secondary)">@ ${new Date(ev.absoluteStart).toLocaleTimeString()}</span></div>`;
            });
          } catch (e) {
            console.warn(`Query Warning: ${e.message}`); // Using warn to not float UI logs
          }
        }

        // --- PLAYER LOGIC ---

        resyncAudio() {
          const event = this.radio.getCurrentEvent();
          if (!event) return;
          this.log('Resyncing audio to radio timeline...');
          this.audio.currentTime = (event.duration - event.remainingTime) / 1000;
          if (this.audio.paused && this.isEngineStarted) this.audio.play();
        }

        syncAudioWithRadio(event) {
          if (!event) {
            if (this.currentPlayingId !== null) {
              this.audio.pause();
              this.currentPlayingId = null;
              this.resetThumbnail();
            }
            return;
          }

          if (this.currentPlayingId !== event.id) {
            this.currentPlayingId = event.id;
            this.audio.src = event.url;
            this.loadThumbnail(event.id);

            if (this.isEngineStarted) {
              this.audio.play().catch((e) => this.log('Autoplay blocked. Click Start Engine.'));
            }
          }
        }

        loadThumbnail(id) {
          this.imgEl.classList.remove('default');

          // Clears memory if there was a previous thumbnail generated by Blob
          if (this.imgEl.src) {
            URL.revokeObjectURL(this.imgEl.src);
            delete this.imgEl.src;
          }

          // Search lists for the original content that has the picture array
          let content = this.radio.allList.find((c) => c.id === id);
          if (!content) {
            const cp = this.radio.customPositions.find((c) => c.content.id === id);
            if (cp) content = cp.content;
          }

          // If we find a picture extracted by the music-metadata
          if (content && content.picture && content.picture.length > 0) {
            const pic = content.picture[0];
            const blob = new Blob([new Uint8Array(pic.data)], { type: pic.format });
            const url = URL.createObjectURL(blob);
            console.log(content, url);
            this.imgEl.src = url;
          } else {
            this.resetThumbnail();
          }
        }

        resetThumbnail() {
          this.imgEl.classList.add('default');
          this.imgEl.src =
            "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18V5l12-2v13'></path><circle cx='6' cy='18' r='3'></circle><circle cx='18' cy='16' r='3'></circle></svg>";
        }

        async handleExport() {
          this.log('Generating Export...');
          const jsonString = this.radio.exportState();
          const blob = new Blob([jsonString], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `tinyradiofm-full-state-${new Date().getTime()}.json`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          this.log('Export complete.');
        }

        handleImport(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const json = JSON.parse(e.target.result);
              this.radio.importState(json);
              this.log('Import success.');
            } catch (err) {
              this.log(`Import error: ${err.message}`);
            }
          };
          reader.readAsText(file);
        }

        updateLists() {
          const mList = document.getElementById('list-music');
          const oList = document.getElementById('list-others');
          mList.innerHTML = '';
          oList.innerHTML = '';

          this.radio.musicList.forEach(
            (m) =>
              (mList.innerHTML += `<div class="log-entry"><span class="tag tag-music">M</span> <div>${m.title}<br><small style="color:var(--text-secondary)">ID: ${m.id}</small></div></div>`),
          );

          this.radio.voiceList.forEach(
            (v) =>
              (oList.innerHTML += `<div class="log-entry"><span class="tag tag-voice">V</span> <div>${v.title}<br><small style="color:var(--text-secondary)">ID: ${v.id}</small></div></div>`),
          );

          this.radio.customPositions.forEach(
            (c) =>
              (oList.innerHTML += `<div class="log-entry"><span class="tag tag-custom">C</span> <div>${c.content.title}<br><small style="color:var(--text-secondary)">ID: ${c.content.id} @ ${c.intendedTimestamp}</small></div></div>`),
          );

          this.radio.scheduledTasks.forEach(
            (t) =>
              (oList.innerHTML += `<div class="log-entry"><span class="tag tag-task">T</span> <div>Action: ${t.action} [${t.type}]<br><small style="color:var(--text-secondary)">Exec: ${t.timestamp}</small></div></div>`),
          );
        }

        startUpdateLoop() {
          setInterval(() => {
            // Clock
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();

            // QueryEngine Autoupdate every 1 second (10 ticks)
            this.tickCounter++;
            if (this.tickCounter % 10 === 0) {
              this.handleQuery();
            }

            // Live Status
            const event = this.radio.getCurrentEvent();

            // Update UI Status
            const stTitle = document.getElementById('st-title');
            const stArtist = document.getElementById('st-artist');
            const stRem = document.getElementById('st-rem');
            const prog = document.getElementById('progress-bar');

            if (event) {
              stTitle.innerText = event.title;
              stArtist.innerText = event.artist;
              stRem.innerText = `${Math.floor(event.remainingTime / 1000)}s`;
              prog.style.width = `${event.progress * 100}%`;

              // Sync the Audio Engine
              this.syncAudioWithRadio(event);
            } else {
              stTitle.innerText = 'Idle';
              stArtist.innerText = '-';
              stRem.innerText = '-';
              prog.style.width = '0%';
              this.syncAudioWithRadio(null);
            }
          }, 100);
        }
      }

      // Initialize the environment
      window.addEventListener('DOMContentLoaded', () => {
        window.env = new TestEnvironment();
      });
    </script>
  </body>
</html>
