<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyRadioFm | Professional Test Environment</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #334155;
        --font-mono: 'Fira Code', 'Cascadia Code', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Layout Structure */
      header {
        padding: 1rem 2rem;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      main {
        display: grid;
        grid-template-columns: 350px 1fr 400px;
        gap: 1px;
        background: var(--border);
        flex: 1;
        overflow: hidden;
      }

      section {
        background: var(--bg-color);
        padding: 1.5rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      /* UI Components */
      .card {
        background: var(--card-bg);
        border-radius: 8px;
        padding: 1rem;
        border: 1px solid var(--border);
      }

      h2 {
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn {
        cursor: pointer;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        border: none;
        font-weight: 600;
        font-size: 0.875rem;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--bg-color);
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-primary);
      }
      .btn-outline:hover {
        background: var(--border);
      }
      .btn-danger {
        background: var(--danger);
        color: white;
      }
      .btn-warning {
        background: var(--warning);
        color: var(--bg-color);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      label {
        font-size: 0.75rem;
        color: var(--text-secondary);
      }

      input,
      select,
      textarea {
        background: var(--bg-color);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 0.5rem;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 0.875rem;
      }

      /* PLAYER UI */
      #player-card {
        border: 2px solid var(--accent);
        background: linear-gradient(145deg, #1e293b, #0f172a);
      }

      /* Live Status Display */
      #live-status {
        background: rgba(0, 0, 0, 0.3);
        padding: 1rem;
        border-radius: 6px;
        border-left: 4px solid var(--accent);
      }

      .status-item {
        font-size: 0.875rem;
        margin-bottom: 0.25rem;
      }
      .status-label {
        color: var(--text-secondary);
      }
      .status-value {
        color: var(--accent);
        font-family: var(--font-mono);
      }

      .progress-container {
        width: 100%;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        margin-top: 0.5rem;
        overflow: hidden;
      }
      #progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
      }

      .player-controls {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1rem;
      }

      .volume-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
      }

      input[type='range'] {
        flex: 1;
        cursor: pointer;
      }

      /* LISTS & LOGS */
      .list-container {
        font-size: 0.75rem;
        max-height: 200px;
        overflow-y: auto;
        background: #000;
        padding: 0.5rem;
        border-radius: 4px;
        font-family: var(--font-mono);
      }

      .log-entry {
        padding: 0.25rem 0;
        border-bottom: 1px solid #1e293b;
        display: flex;
        gap: 0.5rem;
      }

      .log-time {
        color: var(--text-secondary);
      }
      .log-msg {
        color: var(--text-primary);
      }

      .tag {
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 10px;
        text-transform: uppercase;
      }
      .tag-music {
        background: #1e40af;
      }
      .tag-voice {
        background: #065f46;
      }
      .tag-custom {
        background: #92400e;
      }

      /* Progress Bar */
      .progress-container {
        width: 100%;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        margin-top: 0.5rem;
        overflow: hidden;
      }
      #progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.1s linear;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Audio Engine (Hidden) -->
    <audio id="audio-engine"></audio>

    <header>
      <div>
        <h1 style="font-size: 1.25rem">
          TinyRadioFm <span style="color: var(--accent); font-weight: 300">Test Suite</span>
        </h1>
      </div>
      <div id="clock" style="font-family: var(--font-mono); color: var(--text-secondary)">
        00:00:00
      </div>
    </header>

    <main>
      <!-- COLUMN 1: CONTROLS -->
      <section>
        <div class="card">
          <h2 style="color: var(--accent)">
            <span style="color: var(--accent)">+</span> Add Content
          </h2>
          <div class="input-group">
            <label>Audio File</label>
            <input type="file" id="file-input" accept="audio/*" />
          </div>
          <div class="input-group">
            <label>Category</label>
            <select id="content-type">
              <option value="music">Music</option>
              <option value="voice">Voice</option>
              <option value="custom">Custom Position</option>
            </select>
          </div>
          <div class="input-group">
            <label>Custom Timestamp (ms) - Only for Custom</label>
            <input type="number" id="custom-ts" value="0" />
          </div>
          <button class="btn btn-primary" id="btn-add" style="width: 100%">Load & Add</button>
        </div>

        <div class="card">
          <h2 style="color: var(--warning)">
            <span style="color: var(--warning)">⚙</span> Configuration
          </h2>
          <div class="input-group">
            <label>Random Seed</label>
            <input type="number" id="cfg-seed" value="12345" />
          </div>
          <div class="input-group">
            <label>Music Mode</label>
            <select id="cfg-mode">
              <option value="playlist">Playlist</option>
              <option value="random">Random (Weighted)</option>
            </select>
          </div>
          <div class="input-group">
            <label>Silence Gap (ms)</label>
            <input type="number" id="cfg-silence" value="1000" />
          </div>
          <button class="btn btn-outline" id="btn-apply-cfg" style="width: 100%">
            Apply Config
          </button>
        </div>

        <div class="card">
          <h2 style="color: var(--danger)">
            <span style="color: var(--danger)">📅</span> Schedule Task
          </h2>
          <div class="input-group">
            <label>Execution Time (ms from now)</label>
            <input type="number" id="task-delay" value="5000" />
          </div>
          <div class="input-group">
            <label>Action</label>
            <select id="task-action">
              <option value="add">Add (Voice)</option>
              <option value="remove">Remove (By ID)</option>
            </select>
          </div>
          <div class="input-group">
            <label>Target ID (for remove)</label>
            <input type="text" id="task-id" placeholder="e.g. 8a2f1b" />
          </div>
          <button class="btn btn-outline" id="btn-schedule" style="width: 100%">
            Schedule Task
          </button>
        </div>
      </section>

      <!-- COLUMN 2: MONITORING & PLAYER -->
      <section>
        <!-- THE PLAYER CARD -->
        <div class="card" id="player-card">
          <h2 style="color: var(--accent)">
            <span style="color: var(--accent)">▶</span> Live Radio Player
          </h2>

          <div id="live-status">
            <div class="status-item">
              <span class="status-label">Now Playing:</span>
              <span class="status-value" id="st-title">Idle</span>
            </div>
            <div class="status-item">
              <span class="status-label">Artist:</span>
              <span class="status-value" id="st-artist">-</span>
            </div>
            <div class="status-item">
              <span class="status-label">Remaining:</span>
              <span class="status-value" id="st-rem">-</span>
            </div>
            <div class="progress-container">
              <div id="progress-bar"></div>
            </div>
          </div>

          <div class="player-controls">
            <button class="btn btn-primary" id="btn-start-engine">Start Engine</button>
            <button class="btn btn-warning" id="btn-resync">Resync 🔄</button>

            <div class="volume-control">
              <label>Vol</label>
              <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" />
            </div>
          </div>
        </div>

        <div class="card">
          <h2 style="color: var(--accent)">🔍 Timeline Query</h2>
          <div class="input-group">
            <label>Target Time Offset (ms from now)</label>
            <input type="number" id="query-offset" value="10000" />
          </div>
          <button class="btn btn-outline" id="btn-query" style="width: 100%">Predict Future</button>
          <div class="list-container" id="query-results" style="margin-top: 1rem; min-height: 60px">
            No prediction.
          </div>
        </div>

        <div class="card" style="flex: 1">
          <h2>📋 Active Playlists</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem">
            <div>
              <label>Music</label>
              <div class="list-container" id="list-music"></div>
            </div>
            <div>
              <label>Voice/Custom</label>
              <div class="list-container" id="list-voice"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- COLUMN 3: SYSTEM -->
      <section>
        <div class="card">
          <h2>💾 State (Base64)</h2>
          <div class="input-group">
            <button class="btn btn-primary" id="btn-export" style="width: 100%">Export JSON</button>
          </div>
          <div class="input-group">
            <button class="btn btn-outline" id="btn-import" style="width: 100%">Import JSON</button>
            <input type="file" id="import-file" accept=".json" style="display: none" />
          </div>
        </div>

        <div class="card" style="flex: 1">
          <h2>📜 System Logs</h2>
          <div
            class="list-container"
            id="system-logs"
            style="height: 100%; min-height: 300px"
          ></div>
        </div>
      </section>
    </main>

    <script type="module">
      /**
       * STUB: TinyEvents
       */
      class TinyEvents {
        constructor() {
          this.listeners = {};
        }
        on(event, cb) {
          (this.listeners[event] = this.listeners[event] || []).push(cb);
        }
        emit(event, data) {
          (this.listeners[event] || []).forEach((cb) => cb(data));
        }
      }

      /**
       * IMPORT: TinyRadioFm
       */
      import { TinyRadioFm } from './src/v1/libs/TinyRadioFm.mjs';
      import { extractId3Tags } from './src/v1/libs/TinyRadioFm/extractId3Tags.mjs';
      import { parseBlob } from 'https://cdn.jsdelivr.net/npm/music-metadata@11.13.0/+esm';
      window.TinyRadioFm = TinyRadioFm;

      // --- UI Controller ---
      class TestEnvironment {
        constructor() {
          this.radio = new TinyRadioFm();
          this.audio = document.getElementById('audio-engine');
          this.currentPlayingId = null;
          this.isEngineStarted = false;

          this.setupEventListeners();
          this.startUpdateLoop();
          this.log('Environment Ready. Click "Start Engine" to enable audio.');
        }

        log(msg) {
          const logs = document.getElementById('system-logs');
          const entry = document.createElement('div');
          entry.className = 'log-entry';
          entry.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> <span class="log-msg">${msg}</span>`;
          logs.prepend(entry);
        }

        setupEventListeners() {
          // Add Content
          document
            .getElementById('btn-add')
            .addEventListener('click', () => this.handleAddContent());

          // Config
          document
            .getElementById('btn-apply-cfg')
            .addEventListener('click', () => this.handleApplyConfig());

          // Schedule
          document
            .getElementById('btn-schedule')
            .addEventListener('click', () => this.handleScheduleTask());

          // Query
          document.getElementById('btn-query').addEventListener('click', () => this.handleQuery());

          // State
          document
            .getElementById('btn-export')
            .addEventListener('click', () => this.handleExport());
          document
            .getElementById('btn-import')
            .addEventListener('click', () => document.getElementById('import-file').click());
          document
            .getElementById('import-file')
            .addEventListener('change', (e) => this.handleImport(e));

          // Player UI
          document
            .getElementById('btn-start-engine')
            .addEventListener('click', () => this.startEngine());
          document.getElementById('btn-resync').addEventListener('click', () => this.resyncAudio());
          document.getElementById('volume-slider').addEventListener('input', (e) => {
            this.audio.volume = e.target.value;
          });

          // Radio Events
          this.radio.on('contentAdded', (d) => this.log(`Added ${d.type}: ${d.data.title}`));
          this.radio.on('taskExecuted', (d) => this.log(`Task: ${d.action} on ${d.type}`));
        }

        async startEngine() {
          this.isEngineStarted = true;
          // Play a silent buffer or just unlock audio context
          this.audio
            .play()
            .then(() => {
              this.audio.pause();
              document.getElementById('btn-start-engine').innerText = 'Engine Running';
              document
                .getElementById('btn-start-engine')
                .classList.replace('btn-primary', 'btn-outline');
              this.log('Audio Engine Unlocked.');
            })
            .catch((e) => this.log('Error starting engine: ' + e.message));
        }

        async handleAddContent() {
          const file = document.getElementById('file-input').files[0];
          if (!file) return alert('Select a file.');
          const type = document.getElementById('content-type').value;
          const customTs = parseInt(document.getElementById('custom-ts').value);

          try {
            this.log(`Processing ${file.name}...`);
            const url = URL.createObjectURL(file);
            const content = await TinyRadioFm.prepareContent(url, {}, (url) =>
              extractId3Tags(url, parseBlob),
            );

            // If custom, we need to handle the timestamp
            if (type === 'custom') {
              content.timestamp = customTs;
              // Note: The class expects timestamp in the data object for custom insertion
            }
            this.radio.add(type, content);
            this.updateLists();
          } catch (err) {
            this.log(`Error: ${err.message}`);
          }
        }

        handleApplyConfig() {
          const cfg = {
            seed: parseInt(document.getElementById('cfg-seed').value),
            mode: document.getElementById('cfg-mode').value,
            silenceDuration: parseInt(document.getElementById('cfg-silence').value),
          };
          this.radio.setSeed(cfg.seed);
          this.radio.setConfig(cfg);
          this.log('Config applied.');
        }

        handleScheduleTask() {
          const delay = parseInt(document.getElementById('task-delay').value);
          const action = document.getElementById('task-action').value;
          const targetId = document.getElementById('task-id').value;
          const timestamp = Date.now() + delay;

          if (action === 'add') {
            // For testing add, we'll just add a dummy voice message
            this.radio.scheduleTask(timestamp, 'add', 'voice', {
              id: 'task-' + Math.random().toString(36).substr(2, 5),
              title: 'Scheduled Voice',
              artist: 'System',
              duration: 5000,
              url: '',
            });
          } else {
            this.radio.scheduleTask(timestamp, 'remove', 'music', targetId);
          }
          this.log(`Task scheduled (+${delay}ms)`);
        }

        handleQuery() {
          const offset = parseInt(document.getElementById('query-offset').value);
          const results = this.radio.queryTimeline(Date.now() + offset, 5);
          const container = document.getElementById('query-results');
          container.innerHTML = results.length ? '' : 'No upcoming.';
          results.forEach((ev) => {
            container.innerHTML += `<div class="log-entry"><span>${ev.title}</span> <span style="color:var(--text-secondary)">@ ${new Date(ev.absoluteStart).toLocaleTimeString()}</span></div>`;
          });
        }

        // --- PLAYER LOGIC ---

        resyncAudio() {
          const event = this.radio.getCurrentEvent();
          if (!event) return;

          this.log('Resyncing audio to radio timeline...');
          this.audio.currentTime = (event.duration - event.remainingTime) / 1000;
          // If it was paused, play it
          if (this.audio.paused) this.audio.play();
        }

        syncAudioWithRadio(event) {
          if (!event) {
            if (this.currentPlayingId !== null) {
              this.audio.pause();
              this.currentPlayingId = null;
            }
            return;
          }

          // If the track changed
          if (this.currentPlayingId !== event.id) {
            this.log(`Switching to: ${event.title}`);
            this.currentPlayingId = event.id;
            this.audio.src = event.url;
            this.audio.play().catch((e) => this.log('Autoplay blocked. Click Start Engine.'));
          }

          // Drift Correction: If audio is more than 1.5s out of sync with the radio logic,
          // we don't auto-jump (to avoid annoying the user), but we log it.
          const expectedTime = (event.duration - event.remainingTime) / 1000;
          const drift = Math.abs(this.audio.currentTime - expectedTime);
          if (drift > 1.5 && this.currentPlayingId === event.id) {
            // We could auto-resync here, but it's better to let the user click the button
            // to avoid sudden jumps during listening.
          }
        }

        async handleExport() {
          this.log('Generating Deep Export...');
          const state = JSON.parse(this.radio.exportState());

          // Helper to convert URL to Base64
          const toBase64 = async (url) => {
            if (!url || url.startsWith('http') || url.startsWith('data:')) return url;
            try {
              const resp = await fetch(url);
              const blob = await resp.blob();
              return new Promise((res) => {
                const r = new FileReader();
                r.onloadend = () => res(r.result);
                r.readAsDataURL(blob);
              });
            } catch (e) {
              return url;
            }
          };

          // Deep traverse and convert
          const processList = async (list) => {
            for (let i of list) {
              if (i.url) i.url = await toBase64(i.url);
              if (i.content && i.content.url) i.content.url = await toBase64(i.content.url);
            }
          };

          await processList(state.music);
          await processList(state.voice);
          await processList(state.custom);

          // --- DOWNLOAD LOGIC ---
          const jsonString = JSON.stringify(state, null, 2);
          const blob = new Blob([jsonString], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');

          link.href = url;
          link.download = `tinyradiofm-state-${new Date().getTime()}.json`;

          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          // ----------------------

          this.log('Export complete. File downloaded.');
        }

        handleImport(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const json = JSON.parse(e.target.result);
              this.radio.importState(json);
              this.updateLists();
              this.log('Import success.');
            } catch (err) {
              this.log(`Import error: ${err.message}`);
            }
          };
          reader.readAsText(file);
        }

        updateLists() {
          const mList = document.getElementById('list-music');
          const vList = document.getElementById('list-voice');
          mList.innerHTML = '';
          vList.innerHTML = '';

          // We need to access private fields via the public state export for testing
          const state = JSON.parse(this.radio.exportState());
          state.music.forEach(
            (m) =>
              (mList.innerHTML += `<div class="log-entry"><span class="tag tag-music">M</span> ${m.title}</div>`),
          );
          state.voice.forEach(
            (v) =>
              (vList.innerHTML += `<div class="log-entry"><span class="tag tag-voice">V</span> ${v.title}</div>`),
          );
          state.custom.forEach(
            (c) =>
              (vList.innerHTML += `<div class="log-entry"><span class="tag tag-custom">C</span> ${c.content.title}</div>`),
          );
        }

        startUpdateLoop() {
          setInterval(() => {
            // Clock
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();

            // Live Status
            const event = this.radio.getCurrentEvent();

            // Update UI Status
            const stTitle = document.getElementById('st-title');
            const stArtist = document.getElementById('st-artist');
            const stRem = document.getElementById('st-rem');
            const prog = document.getElementById('progress-bar');

            if (event) {
              stTitle.innerText = event.title;
              stArtist.innerText = event.artist;
              stRem.innerText = `${Math.floor(event.remainingTime / 1000)}s`;
              prog.style.width = `${event.progress * 100}%`;

              // Sync the Audio Engine
              this.syncAudioWithRadio(event);
            } else {
              stTitle.innerText = 'Idle';
              stArtist.innerText = '-';
              stRem.innerText = '-';
              prog.style.width = '0%';
              this.syncAudioWithRadio(null);
            }
          }, 100);
        }
      }

      // Initialize the environment
      window.addEventListener('DOMContentLoaded', () => {
        window.env = new TestEnvironment();
      });
    </script>
  </body>
</html>
