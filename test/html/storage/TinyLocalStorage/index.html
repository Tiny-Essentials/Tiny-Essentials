<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyLocalStorage Test Page</title>
    <script type="importmap">
      {
        "imports": {
          "events": "https://esm.sh/events@3.3.0"
        }
      }
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="max-w-5xl mx-auto p-6">
      <h1 class="text-3xl font-bold mb-6">TinyLocalStorage Advanced Test Suite</h1>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Test Controls Panel -->
        <div class="space-y-4">
          <div class="bg-white shadow-md rounded-lg p-4">
            <h2 class="text-xl font-semibold mb-2">Store Various Types</h2>
            <div class="space-y-2">
              <button
                onclick="runSetTests()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded"
              >
                Store Sample Data
              </button>
              <button
                onclick="runGetTests()"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded"
              >
                Retrieve and Verify
              </button>
              <button
                onclick="runRemoveTests()"
                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded"
              >
                Remove Test Items
              </button>
              <button
                onclick="clearLog()"
                class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded"
              >
                Clear Log
              </button>
            </div>
          </div>

          <div class="bg-white shadow-md rounded-lg p-4">
            <h2 class="text-xl font-semibold mb-2">Manual Entry</h2>
            <input
              type="text"
              id="manualKey"
              placeholder="Key"
              class="border px-2 py-1 rounded w-full mb-2"
            />
            <input
              type="text"
              id="manualValue"
              placeholder="Value"
              class="border px-2 py-1 rounded w-full mb-2"
            />
            <div class="space-x-2">
              <button
                onclick="manualSet()"
                class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1 rounded"
              >
                Set
              </button>
              <button
                onclick="manualGet()"
                class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-1 rounded"
              >
                Get
              </button>
            </div>
          </div>
        </div>

        <!-- Logs Panel -->
        <div class="bg-white shadow-md rounded-lg p-4">
          <h2 class="text-xl font-semibold mb-2">Event Log</h2>
          <div
            id="log"
            class="h-96 overflow-y-auto bg-gray-50 border border-gray-200 rounded"
          ></div>
        </div>
      </div>
    </div>

    <script type="module"></script>
  </body>
</html>
