<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plugin Manager - Test Suite</title>
    <style>
      :root {
        --bg-color: #1e1e2e;
        --panel-bg: #282a36;
        --text-color: #f8f8f2;
        --success-color: #50fa7b;
        --error-color: #ff5555;
        --border-color: #44475a;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        width: 100%;
        max-width: 900px;
      }
      h1 {
        text-align: center;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 1rem;
        margin-bottom: 2rem;
      }
      .test-box {
        background-color: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .test-header {
        display: flex;
        justify-content: space-between;
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
      }
      .status-pass {
        color: var(--success-color);
      }
      .status-fail {
        color: var(--error-color);
      }
      .log-output {
        background-color: #000;
        padding: 1rem;
        border-radius: 4px;
        font-family: monospace;
        white-space: pre-wrap;
        color: #8be9fd;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>TinyClassManager Test Suite</h1>
      <div id="test-results"></div>
    </div>

    <script type="module">
      import { TinyClassManager } from './src/v1/libs/TinyClassManager.mjs';

      // ============================================================================
      // Mock Data & Plugins
      // ============================================================================

      /**
       * The foundational core class for our tests.
       */
      class EntityCore {
        /**
         * @param {string} id - The unique identifier.
         */
        constructor(id) {
          this.id = id;
        }
      }

      /**
       * @type {import('../TinyClassManager.mjs').PluginDefinition<typeof EntityCore, any>}
       */
      const Health = {
        name: 'Health',
        dependencies: [],
        apply: (Base) =>
          class HealthPlugin extends Base {
            /**
             * @param {string} id
             */
            constructor(id) {
              super(id);
              this.hp = 100;
            }
            /**
             * @param {number} amount
             */
            takeDamage(amount) {
              this.hp -= amount;
            }
          },
      };

      /**
       * @type {import('../TinyClassManager.mjs').PluginDefinition<any, any>}
       */
      const Armor = {
        name: 'Armor',
        dependencies: ['Health'],
        apply: (Base) =>
          class ArmorPlugin extends Base {
            /**
             * @param {string} id
             */
            constructor(id) {
              super(id);
              this.armor = 50;
            }
            /**
             * @param {number} amount
             */
            takeDamage(amount) {
              const reducedDamage = Math.max(0, amount - this.armor * 0.1);
              super.takeDamage(reducedDamage);
            }
          },
      };

      // ============================================================================
      // Test Engine
      // ============================================================================

      /**
       * Creates and appends a test result interface to the DOM.
       * @param {string} title - The description of the test.
       * @param {boolean} passed - Whether the test succeeded.
       * @param {string} logs - The captured log output or error messages.
       * @returns {void}
       */
      const renderResult = (title, passed, logs) => {
        /** @type {HTMLElement} */
        const container = document.getElementById('test-results');
        /** @type {HTMLDivElement} */
        const box = document.createElement('div');
        box.className = 'test-box';

        /** @type {string} */
        const statusText = passed ? '✔ PASSED' : '✖ FAILED';
        /** @type {string} */
        const statusClass = passed ? 'status-pass' : 'status-fail';

        box.innerHTML = `
        <div class="test-header">
          <span>${title}</span>
          <span class="${statusClass}">${statusText}</span>
        </div>
        <div class="log-output">${logs}</div>
      `;
        container.appendChild(box);
      };

      /**
       * Executes a single test case safely and captures assertions.
       * @param {string} title - The name of the test.
       * @param {function(): void} testFn - The function containing the test logic.
       * @returns {void}
       */
      const runTest = (title, testFn) => {
        /** @type {string[]} */
        const logs = [];
        let passed = true;

        /**
         * Sub-function to handle custom assertions inside the test.
         * @param {boolean} condition - The condition that must be true.
         * @param {string} message - The message to log if assertion fails.
         * @throws {Error} Throws if the condition is false.
         */
        const assert = (condition, message) => {
          if (!condition) throw new Error(`Assertion Failed: ${message}`);
        };

        try {
          testFn(assert, (/** @type {string} */ msg) => logs.push(`INFO: ${msg}`));
        } catch (/** @type {any} */ error) {
          passed = false;
          logs.push(`ERROR: ${error.message}`);
        }

        renderResult(title, passed, logs.join('\\n') || 'No logs generated.');
      };

      // ============================================================================
      // Test Cases
      // ============================================================================

      runTest('1. Should successfully apply Health and Armor plugins', (assert, log) => {
        const CoreManager = new TinyClassManager(EntityCore);
        const FinalClass = CoreManager.use(Health).use(Armor).build();

        const entity = new FinalClass('Hero_1');
        entity.takeDamage(30);

        assert(entity.hp === 75, 'HP should be reduced by 25 (30 - 5 armor mitigation)');
        assert(entity.armor === 50, 'Armor should remain 50');
        log(`Success! Final HP: ${entity.hp}, Final Armor: ${entity.armor}`);
      });

      runTest('2. Should throw error when missing a dependency', (assert, log) => {
        const CoreManager = new TinyClassManager(EntityCore);

        let caughtError = false;
        try {
          CoreManager.use(Armor); // Fails because Health is not applied
        } catch (err) {
          caughtError = true;
          log(err.message);
        }

        assert(caughtError, 'Manager should have thrown a missing dependency error.');
      });

      runTest('3. Should throw error when applying duplicate plugins', (assert, log) => {
        const CoreManager = new TinyClassManager(EntityCore);
        const Step1 = CoreManager.use(Health);

        let caughtError = false;
        try {
          Step1.use(Health); // Fails because Health is already applied
        } catch (err) {
          caughtError = true;
          log(err.message);
        }

        assert(caughtError, 'Manager should have thrown a duplicate plugin error.');
      });

      runTest('4. Should block reuse of consumed manager instances', (assert, log) => {
        const CoreManager = new TinyClassManager(EntityCore);
        CoreManager.use(Health); // Consumes CoreManager

        let caughtError = false;
        try {
          CoreManager.use(Health); // Try to reuse the old instance
        } catch (err) {
          caughtError = true;
          log(err.message);
        }

        assert(caughtError, 'Manager should prevent reusing a consumed instance.');
      });
    </script>
  </body>
</html>
