<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyMediaPlayer - QA Environment</title>
    <script type="importmap">
      {
        "imports": {
          "events": "https://esm.sh/events@3.3.0"
        }
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>TinyMediaPlayer - System Verification Dashboard</h1>
      <p style="color: var(--text-muted)">
        Professional testing environment for the universal media wrapper.
      </p>
    </header>

    <main class="dashboard-grid">
      <!-- 1. VISUAL PLAYER (NEW) -->
      <section class="panel full-width">
        <h2>Visual Playback Monitor</h2>
        <div class="visual-player-container">
          <div class="now-playing-info">
            <span id="display-title" class="now-playing-title">No Track Loaded</span>
            <span id="display-artist" class="now-playing-artist">---</span>
          </div>
          <div class="progress-wrapper">
            <span id="time-current" class="time-display">00:00</span>
            <input type="range" id="progress-slider" min="0" max="100" value="0" step="0.1" />
            <span id="time-total" class="time-display">00:00</span>
          </div>
        </div>
      </section>

      <!-- 2. PLAYBACK CONTROLS -->
      <div class="left-col">
        <section class="panel" style="margin-bottom: 2rem">
          <h2>1. Playback Controls</h2>
          <div class="control-row" style="margin-bottom: 1rem">
            <button id="btn-play">Play</button>
            <button id="btn-pause">Pause</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-prev">Prev</button>
            <button id="btn-next">Next</button>
          </div>

          <div class="control-group">
            <label for="seek-input">Seek to Timeline (ms):</label>
            <div class="control-row">
              <input type="number" id="seek-input" value="15000" min="0" />
              <button id="btn-seek">Seek</button>
            </div>
          </div>

          <div class="control-group">
            <label for="step-input">Step Timeline Forward/Backward (ms):</label>
            <div class="control-row">
              <input type="number" id="step-input" value="5000" />
              <button id="btn-step">Apply Step</button>
            </div>
          </div>
        </section>

        <section class="panel" style="margin-bottom: 2rem">
          <h2>2. State & Settings Management</h2>
          <div class="control-group">
            <label for="volume-slider">Global Volume:</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" />
          </div>

          <div class="control-row" style="margin-bottom: 1rem">
            <div class="control-group" style="flex: 1">
              <label for="loop-select">Loop Mode:</label>
              <select id="loop-select">
                <option value="NONE">NONE</option>
                <option value="TRACK">TRACK</option>
                <option value="PLAYLIST">PLAYLIST</option>
              </select>
            </div>
            <div class="control-group" style="flex: 1">
              <label
                style="
                  display: flex;
                  align-items: center;
                  gap: 0.5rem;
                  height: 100%;
                  margin-top: 1rem;
                "
              >
                <input type="checkbox" id="random-checkbox" />
                Enable Random Mode
              </label>
            </div>
          </div>

          <div class="control-group">
            <label style="display: flex; align-items: center; gap: 0.5rem">
              <input type="checkbox" id="persist-volume-checkbox" />
              Persist Volume in localStorage
            </label>
            <input
              type="text"
              id="storage-key-input"
              placeholder="Volume Storage Key"
              value="tiny_media_player_volume"
              style="margin-top: 0.5rem"
            />
            <button id="btn-update-storage" style="margin-top: 0.5rem">Update Storage Key</button>
          </div>
        </section>

        <!-- 3. SYSTEM LOGS -->
        <section class="panel full-width">
          <h2>5. System Logs</h2>
          <div id="system-logs" class="status-box" style="height: 150px"></div>
        </section>
      </div>

      <!-- 4. PLAYLIST & EVENTS -->
      <div class="right-col">
        <section class="panel" style="margin-bottom: 2rem">
          <h2>3. Playlist Management</h2>
          <div class="control-group">
            <label>Add New Track:</label>
            <input
              type="text"
              id="track-url"
              placeholder="Media URL"
              value="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"
            />
            <input
              type="text"
              id="track-title"
              placeholder="Track Title"
              value="T-Rex Roar (MDN Sample)"
            />
            <div class="control-row" style="margin-top: 0.5rem">
              <button id="btn-add-track">Add to Playlist</button>
              <button id="btn-clear-playlist" class="btn-danger">Clear Playlist</button>
            </div>
          </div>

          <hr style="border-color: var(--border-color); margin: 1rem 0" />

          <div class="control-group">
            <label>Search Tracks:</label>
            <div class="control-row">
              <input type="text" id="search-track-input" placeholder="Search by title, artist..." />
              <button id="btn-search-track">Search</button>
            </div>
          </div>

          <div class="control-group">
            <label>Inspect Track by Index:</label>
            <div class="control-row">
              <input
                type="number"
                id="get-track-index"
                placeholder="Index (e.g., 0)"
                min="0"
                value="0"
              />
              <button id="btn-get-track">Check & Get</button>
            </div>
          </div>

          <div class="control-group">
            <label>Remove Track by Index:</label>
            <div class="control-row">
              <input
                type="number"
                id="remove-track-index"
                placeholder="Index (e.g., 0)"
                min="0"
                value="0"
              />
              <button id="btn-remove-track" class="btn-danger">Remove Track</button>
            </div>
          </div>

          <div class="control-group" style="margin-top: 1.5rem">
            <label>Current Playlist:</label>
            <div id="playlist-view" class="playlist-view"></div>
          </div>
        </section>

        <section class="panel">
          <h2>4. Event Stream Monitor</h2>
          <div id="event-monitor" class="status-box"></div>
        </section>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
