<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iframe Page</title>
    <script type="importmap">
      {
        "imports": {
          "events": "https://esm.sh/events@3.3.0"
        }
      }
    </script>
    <style>
      body {
        background: #eef;
        font-family: sans-serif;
      }
      button {
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Iframe Page</h1>
    <button id="sendToParent">Send Message to Parent</button>
    <div id="log"></div>

    <script type="module">
      import { TinyIframeEvents } from '../src/v1/libs/TinyIframeEvents.mjs';

      const events = new TinyIframeEvents();
      events.secretEventName = '__PUDDING__';

      // Envia mensagem ao parent
      document.getElementById('sendToParent').onclick = () => {
        events.winEmit('hello:fromIframe', {
          timestamp: new Date().toISOString(),
          content: 'Oi parent!',
        });
      };

      // Ouve evento do parent
      events.on('win:hello:fromParent', (payload, meta) => {
        log('📨 Received from parent:', payload);
        console.log('iframe', payload, meta);
      });

      function log(...args) {
        const out = document.getElementById('log');
        const p = document.createElement('p');
        p.textContent = args.map((a) => JSON.stringify(a)).join(' ');
        out.appendChild(p);
      }
    </script>
  </body>
</html>
