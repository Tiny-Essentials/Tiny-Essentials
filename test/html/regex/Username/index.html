<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Username Regex Tester | Professional Debugger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Username Regex <span style="font-weight: 300; color: var(--text-dim)">Debugger</span></h1>
      <div class="status-badge" id="status">Ready</div>
    </header>

    <main>
      <!-- Sidebar: Configuration -->
      <section class="sidebar">
        <div class="control-group">
          <label for="protocolSelect">Protocol Template</label>
          <select id="protocolSelect">
            <option value="all">-- Run All Protocols --</option>
            <optgroup label="Default" id="opt-default"></optgroup>
            <optgroup label="BlueSky / AT" id="opt-bluesky"></optgroup>
            <optgroup label="Discord" id="opt-discord"></optgroup>
            <optgroup label="Matrix" id="opt-matrix"></optgroup>
            <option value="custom">Custom (Manual Config)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="transformSelect">Transformation</label>
          <select id="transformSelect">
            <option value="null">None</option>
            <option value="lowercase">lowercase</option>
            <option value="uppercase">uppercase</option>
          </select>
        </div>

        <!-- SANDBOX SECTION: Only visible when 'Custom' is selected -->
        <div id="customConfig" class="sandbox-section" style="display: none">
          <h3>Custom Sandbox</h3>

          <div class="control-group">
            <label>Prefix (e.g. @)</label>
            <input type="text" id="customPrefix" placeholder="@" />
          </div>

          <div class="control-group">
            <label>Start Regex</label>
            <input type="text" id="customStart" placeholder="" />
          </div>

          <div class="control-group">
            <label>Valid Characters (Regex)</label>
            <input type="text" id="customValidValues" value="[a-zA-Z0-9_]" />
          </div>

          <div class="grid-2">
            <div class="control-group">
              <label>Min Length</label>
              <input type="number" id="customMinLen" value="3" />
            </div>
            <div class="control-group">
              <label>Max Length</label>
              <input type="number" id="customMaxLen" value="20" />
            </div>
          </div>

          <div class="control-group">
            <label>End Regex (e.g. >)</label>
            <input type="text" id="customEnd" placeholder="" />
          </div>

          <div class="control-group">
            <label>Domain (Literal)</label>
            <input type="text" id="customDomain" placeholder="matrix.org" />
          </div>

          <div class="control-group">
            <label>Domain Pattern (Regex)</label>
            <input type="text" id="customDomainPattern" placeholder="@[a-z]+\.[a-z]{2,}" />
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border)" />

        <div class="control-group">
          <label>Quick Test Data</label>
          <button class="secondary" onclick="loadExample('bluesky')">Load BlueSky Example</button>
          <button class="secondary" onclick="loadExample('discord')">Load Discord Example</button>
          <button class="secondary" onclick="loadExample('matrix')">Load Matrix Example</button>
        </div>

        <button id="runBtn">Run Extraction</button>
      </section>

      <!-- Editor: Input -->
      <section class="editor-container">
        <label>Input Text to Scan</label>
        <textarea
          id="testInput"
          placeholder="Enter text containing usernames to test..."
        ></textarea>
      </section>

      <!-- Results: Output -->
      <section class="results-container">
        <div class="results-header">
          <label>Extraction Results</label>
          <span id="matchCount" style="font-size: 0.75rem; color: var(--text-dim)">0 matches</span>
        </div>
        <div id="resultsList">
          <div class="empty-state">No matches found. Run the extraction to see results.</div>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
