<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyArrayComparator Tester</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>TinyArrayComparator Tester</h1>

    <div class="controls-container">
      <div class="file-input-group">
        <label for="oldFileInput">Old Array (JSON file):</label>
        <input type="file" id="oldFileInput" accept=".json" />
      </div>

      <div class="file-input-group">
        <label for="newFileInput">New Array (JSON file):</label>
        <input type="file" id="newFileInput" accept=".json" />
      </div>

      <button id="compareBtn">Compare Arrays</button>
    </div>

    <div id="errorDisplay" class="error-message"></div>

    <div class="results-container">
      <div class="result-box">
        <div class="result-header header-deleted">Deleted Items</div>
        <div class="result-content" id="deletedContent">No data yet.</div>
      </div>
      <div class="result-box">
        <div class="result-header header-added">Added Items</div>
        <div class="result-content" id="addedContent">No data yet.</div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
