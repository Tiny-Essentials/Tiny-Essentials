<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyArrayComparator Tester</title>
    <style>
      /* Base styling for a clean, professional dark mode UI */
      :root {
        --bg-color: #1e1e1e;
        --panel-bg: #2d2d30;
        --text-color: #cccccc;
        --accent-color: #007acc;
        --border-color: #3e3e42;
        --added-color: #4ade80;
        --deleted-color: #f87171;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        color: #ffffff;
        margin-bottom: 2rem;
      }

      .controls-container {
        display: flex;
        gap: 2rem;
        margin-bottom: 2rem;
        background-color: var(--panel-bg);
        padding: 1.5rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        width: 100%;
        max-width: 800px;
      }

      .file-input-group {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .file-input-group label {
        margin-bottom: 0.5rem;
        font-weight: bold;
        color: #ffffff;
      }

      input[type='file'] {
        padding: 0.5rem;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-color);
      }

      button {
        padding: 0.75rem 1.5rem;
        background-color: var(--accent-color);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
        align-self: flex-end;
      }

      button:hover {
        background-color: #005f9e;
      }

      button:disabled {
        background-color: #555;
        cursor: not-allowed;
      }

      .results-container {
        display: flex;
        gap: 2rem;
        width: 100%;
        max-width: 1000px;
      }

      .result-box {
        flex: 1;
        background-color: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        height: 400px; /* Fixed height for scrolling */
      }

      .result-header {
        padding: 1rem;
        font-weight: bold;
        font-size: 1.1rem;
        border-bottom: 1px solid var(--border-color);
        text-align: center;
      }

      .header-added {
        color: var(--added-color);
      }
      .header-deleted {
        color: var(--deleted-color);
      }

      .result-content {
        padding: 1rem;
        overflow-y: auto;
        flex: 1;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        white-space: pre-wrap; /* Keeps JSON formatting */
      }

      /* Custom scrollbar for better aesthetics */
      .result-content::-webkit-scrollbar {
        width: 8px;
      }
      .result-content::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      .result-content::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 4px;
      }
      .result-content::-webkit-scrollbar-thumb:hover {
        background: #777;
      }

      .error-message {
        color: var(--deleted-color);
        margin-top: 1rem;
        text-align: center;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>TinyArrayComparator Tester</h1>

    <div class="controls-container">
      <div class="file-input-group">
        <label for="oldFileInput">Old Array (JSON file):</label>
        <input type="file" id="oldFileInput" accept=".json" />
      </div>

      <div class="file-input-group">
        <label for="newFileInput">New Array (JSON file):</label>
        <input type="file" id="newFileInput" accept=".json" />
      </div>

      <button id="compareBtn">Compare Arrays</button>
    </div>

    <div id="errorDisplay" class="error-message"></div>

    <div class="results-container">
      <div class="result-box">
        <div class="result-header header-deleted">Deleted Items</div>
        <div class="result-content" id="deletedContent">No data yet.</div>
      </div>
      <div class="result-box">
        <div class="result-header header-added">Added Items</div>
        <div class="result-content" id="addedContent">No data yet.</div>
      </div>
    </div>

    <script type="module">
      import { TinyArrayComparator } from '/src/v1/libs/array/TinyArrayComparator.mjs';

      const oldFileInput = document.getElementById('oldFileInput');
      const newFileInput = document.getElementById('newFileInput');
      const compareBtn = document.getElementById('compareBtn');
      const deletedContent = document.getElementById('deletedContent');
      const addedContent = document.getElementById('addedContent');
      const errorDisplay = document.getElementById('errorDisplay');

      /**
       * Reads a file asynchronously and parses it as JSON.
       * @param {File} file - The file to read.
       * @returns {Promise<Array<any>>} The parsed JSON array.
       */
      const readJsonFile = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const parsedData = JSON.parse(event.target.result);
              if (!Array.isArray(parsedData)) {
                throw new Error(`The file ${file.name} does not contain a valid JSON array.`);
              }
              resolve(parsedData);
            } catch (error) {
              reject(new Error(`Failed to parse ${file.name}: ${error.message}`));
            }
          };
          reader.onerror = () => reject(new Error(`Error reading file ${file.name}`));
          reader.readAsText(file);
        });
      };

      /**
       * Handles the click event for the comparison button.
       */
      const handleCompare = async () => {
        errorDisplay.textContent = ''; // Clear previous errors
        deletedContent.textContent = 'Loading...';
        addedContent.textContent = 'Loading...';

        const oldFile = oldFileInput.files[0];
        const newFile = newFileInput.files[0];

        if (!oldFile || !newFile) {
          errorDisplay.textContent = 'Please select both JSON files before comparing.';
          deletedContent.textContent = '';
          addedContent.textContent = '';
          return;
        }

        try {
          // Read both files concurrently for better performance
          const [oldArray, newArray] = await Promise.all([
            readJsonFile(oldFile),
            readJsonFile(newFile),
          ]);

          const comparator = new TinyArrayComparator(oldArray);
          const results = comparator.compare(newArray);
          window.comparator = comparator;

          // Filter the results to populate the distinct boxes
          const deletedItems = results
            .filter((req) => req.status === 'deleted')
            .map((req) => req.item);
          const addedItems = results.filter((req) => req.status === 'added').map((req) => req.item);

          // Display formatting
          deletedContent.textContent =
            deletedItems.length > 0
              ? JSON.stringify(deletedItems, null, 2)
              : 'No items were deleted.';

          addedContent.textContent =
            addedItems.length > 0 ? JSON.stringify(addedItems, null, 2) : 'No items were added.';
        } catch (error) {
          errorDisplay.textContent = error.message;
          deletedContent.textContent = 'Error.';
          addedContent.textContent = 'Error.';
        }
      };

      compareBtn.addEventListener('click', handleCompare);
    </script>
  </body>
</html>
