<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyArrayPaginator Test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>TinyArrayPaginator Tester</h1>

    <div class="controls">
      <div>
        <label for="page">Page</label><br />
        <input type="number" id="page" value="1" min="1" />
      </div>
      <div>
        <label for="perPage">Items per Page</label><br />
        <input type="number" id="perPage" value="5" min="1" />
      </div>
      <div class="filter-section">
        <label for="filterKey">Filter Key</label><br />
        <input type="text" id="filterKey" placeholder="Example: name" />
        <br />
        <label for="filterValue">Filter Value</label><br />
        <input type="text" id="filterValue" placeholder="Example: John" />
      </div>
      <div style="align-self: end">
        <button id="applyBtn">Apply</button>
      </div>
    </div>

    <div class="results" id="results"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
